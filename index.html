<title>Alappuzha Boat Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Hanken+Grotesk:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage; HUD pinned to the edges; start/result panel anchored bottom-left over a teal scrim. */
:root{
  --ink:#08201f;
  --lagoon:#0d3b39;
  --lagoon-hi:#17605b;
  --kasavu:#f4e9cb;
  --kasavu-dim:rgba(244,233,203,.64);
  --gold:#e3ab3c;
  --gold-deep:#a8730f;
  --hibiscus:#e0482f;
  --scrim:rgba(6,24,23,.78);
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mal:'Noto Sans Malayalam','Nirmala UI',Kartika,sans-serif;
  color-scheme:dark;
}
  
html,body{height:100%;margin:0;background:var(--ink);color:var(--kasavu);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#root{height:100%}
.stage{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ink)}
.stage canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hud-row.bottom{align-items:flex-end}
.score-label,.mini-label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--kasavu-dim)}
.score-num{font-family:var(--display);font-size:clamp(30px,6vw,46px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.stats span b{color:var(--gold);font-weight:800}
.zone-tag{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kasavu-dim)}
.hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto}
.hearts{display:flex;gap:3px;margin-right:6px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(244,233,203,.28);background:var(--scrim);cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn svg{display:block}
.power{width:min(46vw,260px)}
.power-bar{height:12px;margin-top:6px;border-radius:4px;background:rgba(6,24,23,.7);border:1px solid rgba(244,233,203,.3);overflow:hidden}
.power-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .1s linear}
.power-fill.locked{background:var(--hibiscus)}
.power-fill.boosting{background:linear-gradient(90deg,var(--gold),#ffe6a1)}
.spm{margin-top:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.boost-btn{pointer-events:auto;width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:var(--scrim);
  font-weight:800;letter-spacing:.12em;font-size:13px;cursor:pointer;touch-action:none;display:grid;place-items:center;text-align:center;line-height:1.1}
.boost-btn small{display:block;font-size:10px;letter-spacing:.1em;color:var(--kasavu-dim);margin-top:2px}
.boost-btn.on{background:var(--gold);color:var(--ink);border-color:#ffe6a1}
.boost-btn.on small{color:var(--ink)}

.toast{position:absolute;left:50%;top:max(72px,calc(env(safe-area-inset-top,0px) + 64px));transform:translateX(-50%);
  background:var(--scrim);border:1px solid rgba(227,171,60,.6);padding:8px 18px;border-radius:999px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;font-size:12px;white-space:nowrap;pointer-events:none;animation:toast 3.2s ease forwards}
.toast b{color:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 36px rgba(224,72,47,.6);animation:flash .55s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;
  background:linear-gradient(90deg,rgba(6,24,23,.86) 0%,rgba(6,24,23,.5) 42%,rgba(6,24,23,.05) 80%);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.overlay.mid{align-items:center;background:rgba(6,24,23,.62)}
.panel{width:min(520px,100%);min-width:0;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,92px);line-height:.95;letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 3px 0 var(--gold-deep)}
.title.small{font-size:clamp(36px,8vw,60px)}
.mal{margin:0;font-family:var(--mal);font-weight:700;font-size:clamp(24px,5vw,34px);color:var(--gold);line-height:1.2}
.lede{margin:0;max-width:46ch;font-size:16px;line-height:1.5;color:var(--kasavu)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;font-weight:600}
.legend li{display:flex;align-items:center;gap:10px}
.sw{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid rgba(244,233,203,.8)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;font-weight:600;color:var(--kasavu-dim);align-items:center}
.keys span{display:inline-flex;gap:6px;align-items:center}
.key{display:inline-grid;place-items:center;min-width:26px;padding:2px 7px;border:1px solid var(--kasavu-dim);border-bottom-width:3px;border-radius:6px;font-size:12px;font-weight:800;color:var(--kasavu)}
.touch-hint{display:none}
@media (hover:none) and (pointer:coarse){.touch-hint{display:inline-flex}.kb-hint{display:none!important}}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:14px 26px;font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-deep)}
.btn:hover{background:#f0bd55}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--kasavu);border:1px solid var(--kasavu-dim);box-shadow:none}
.best{margin:0;font-size:14px;font-weight:700;color:var(--kasavu-dim);font-variant-numeric:tabular-nums}
.best b{color:var(--kasavu)}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0}
.result div{border-top:1px solid rgba(244,233,203,.3);padding-top:8px}
.result dt{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--kasavu-dim)}
.result dd{margin:2px 0 0;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;align-self:flex-start;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:700}

@media (max-width:640px){
  .overlay{background:linear-gradient(0deg,rgba(6,24,23,.92) 0%,rgba(6,24,23,.65) 60%,rgba(6,24,23,.15) 100%)}
  .boost-btn{width:84px;height:84px}
  .lede{font-size:15px}
}
@media (max-height:560px){.legend{display:none}.lede{display:none}}
@media (prefers-reduced-motion:reduce){.toast,.flash{animation-duration:.01s}.toast{animation:none;opacity:1}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var THREE=window.THREE, R=window.React, RD=window.ReactDOM;
var useState=R.useState, useEffect=R.useEffect, useRef=R.useRef;
var h=R.createElement;

/* ---------- helpers ---------- */
var rand=function(a,b){return a+Math.random()*(b-a);};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var lerp=function(a,b,t){return a+(b-a)*t;};
var smooth=function(t){return t*t*(3-2*t);};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};

/* Bake many primitives into ONE vertex-coloured geometry, so every prop is a single draw call. */
function bake(parts){
  var chunks=[], total=0;
  var m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), v=new THREE.Vector3(), s=new THREE.Vector3();
  parts.forEach(function(pt){
    var g=pt.g.index?pt.g.toNonIndexed():pt.g.clone();
    if(pt.q){q.copy(pt.q);}else{var r=pt.r||[0,0,0];e.set(r[0],r[1],r[2]);q.setFromEuler(e);}
    var p=pt.p||[0,0,0], sc=pt.s||[1,1,1];
    v.set(p[0],p[1],p[2]); s.set(sc[0],sc[1],sc[2]);
    m.compose(v,q,s); g.applyMatrix4(m);
    chunks.push({g:g,c:new THREE.Color(pt.c)}); total+=g.attributes.position.count;
  });
  var pos=new Float32Array(total*3), nor=new Float32Array(total*3), col=new Float32Array(total*3), o=0;
  chunks.forEach(function(ch){
    var n=ch.g.attributes.position.count;
    pos.set(ch.g.attributes.position.array,o*3); nor.set(ch.g.attributes.normal.array,o*3);
    for(var i=0;i<n;i++){col[(o+i)*3]=ch.c.r;col[(o+i)*3+1]=ch.c.g;col[(o+i)*3+2]=ch.c.b;}
    o+=n; ch.g.dispose();
  });
  var out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.BufferAttribute(col,3));
  out.computeBoundingSphere();
  return out;
}
function makeTex(w,hh,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=hh; draw(c.getContext('2d'),w,hh);
  var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
}

/* Alappuzha's stretch of backwater, as zones that blend into each other with distance. */
var ZONES=[
  {name:'Punnamada Lake',at:0,   top:0x3f8fc4,bot:0xf7d9a1,fog:0xf2d9a9,water:0x2f8582,sun:0xfff1c4,sunY:34,light:0xffe3b0,hemi:0xcfe6f0},
  {name:'Kainakary',     at:800, top:0x2f86c9,bot:0xd7ecee,fog:0xd3e7e8,water:0x2d8a86,sun:0xffffff,sunY:62,light:0xffffff,hemi:0xdff0ff},
  {name:'Kuttanad',      at:1700,top:0x4a5fae,bot:0xf2b07c,fog:0xedb487,water:0x2e7480,sun:0xffc890,sunY:20,light:0xffc08a,hemi:0xe9c9b0},
  {name:'Vembanad Lake', at:2700,top:0x1b2b63,bot:0xdd7a5e,fog:0xc9806a,water:0x1f4f5c,sun:0xff9a6a,sunY:10,light:0xff9f7a,hemi:0xb7a4c9}
];
var CYCLE=3700;
function zoneState(d){
  var dd=d%CYCLE, i=0;
  for(var k=0;k<ZONES.length;k++){if(ZONES[k].at<=dd)i=k;}
  var endAt=i<ZONES.length-1?ZONES[i+1].at:CYCLE;
  var t=smooth(clamp((dd-(endAt-350))/350,0,1));
  return {i:i,j:(i+1)%ZONES.length,t:t,id:Math.floor(d/CYCLE)*ZONES.length+i};
}

/* ---------- the 3D game engine ---------- */
function createGame(container,cb){
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    if(!renderer.getContext()) throw new Error('no gl');
  }catch(err){cb.onError('This device could not start 3D graphics (WebGL). Try another browser.');return null;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  container.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var fog=new THREE.Fog(0xf2d9a9,60,225); scene.fog=fog;
  var camera=new THREE.PerspectiveCamera(62,1,0.5,620);

  /* lights */
  var hemi=new THREE.HemisphereLight(0xcfe6f0,0x335533,0.62); scene.add(hemi);
  var sunLight=new THREE.DirectionalLight(0xffe3b0,0.6); sunLight.position.set(-40,60,30); scene.add(sunLight);

  /* sky dome + sun */
  var skyMat=new THREE.ShaderMaterial({
    uniforms:{top:{value:new THREE.Color(0x3f8fc4)},bottom:{value:new THREE.Color(0xf7d9a1)}},
    vertexShader:'varying float vH; void main(){ vH=normalize(position).y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform vec3 top; uniform vec3 bottom; varying float vH; void main(){ float t=smoothstep(-0.02,0.5,vH); gl_FragColor=vec4(mix(bottom,top,t),1.0); }',
    side:THREE.BackSide,depthWrite:false,fog:false});
  var sky=new THREE.Mesh(new THREE.SphereGeometry(450,24,14),skyMat); sky.renderOrder=-2; sky.frustumCulled=false; scene.add(sky);
  var sunMat=new THREE.MeshBasicMaterial({color:0xfff1c4,fog:false});
  var sunMesh=new THREE.Mesh(new THREE.SphereGeometry(16,18,12),sunMat); sunMesh.position.set(-70,34,-380); scene.add(sunMesh);
  var haloMat=new THREE.MeshBasicMaterial({color:0xfff1c4,fog:false,transparent:true,opacity:0.22,depthWrite:false});
  var halo=new THREE.Mesh(new THREE.SphereGeometry(30,18,12),haloMat); sunMesh.add(halo);

  /* water: faceted waves + scrolling fleck texture */
  var WATER_L=260, WATER_Z=-80;
  var waterTex=makeTex(256,256,function(c,w,hh){
    c.fillStyle='#e6f3f3'; c.fillRect(0,0,w,hh);
    for(var i=0;i<260;i++){
      c.strokeStyle=Math.random()<0.5?'rgba(255,255,255,.9)':'rgba(120,175,182,.55)';
      c.lineWidth=1+Math.random()*2; var x=Math.random()*w, y=Math.random()*hh, l=6+Math.random()*22;
      c.beginPath(); c.moveTo(x,y); c.lineTo(x+l,y+Math.random()*3-1.5); c.stroke();
    }
  });
  waterTex.repeat.set(8,26);
  var wg=new THREE.PlaneGeometry(60,WATER_L,30,90); wg.rotateX(-Math.PI/2);
  var wPos=wg.attributes.position, wBase=new Float32Array(wPos.array.length); wBase.set(wPos.array);
  var waterMat=new THREE.MeshPhongMaterial({color:0x2f8582,map:waterTex,flatShading:true,shininess:55,specular:0x7fb9b5});
  var water=new THREE.Mesh(wg,waterMat); water.position.set(0,0,WATER_Z); scene.add(water);

  /* banks: scrolling paddy-field texture */
  var bankTex=makeTex(256,256,function(c,w,hh){
    c.fillStyle='#6d9a48'; c.fillRect(0,0,w,hh);
    var greens=['#5a8a3b','#7aa650','#668f42','#93b35a','#4c7a33'];
    for(var i=0;i<22;i++){c.fillStyle=greens[i%greens.length]; c.fillRect(Math.random()*w,Math.random()*hh,24+Math.random()*80,14+Math.random()*50);}
    c.strokeStyle='rgba(120,190,200,.7)'; c.lineWidth=3;
    for(var k=0;k<5;k++){var yy=Math.random()*hh; c.beginPath(); c.moveTo(0,yy); c.lineTo(w,yy+Math.random()*10-5); c.stroke();}
    for(var n=0;n<400;n++){c.fillStyle='rgba(20,60,20,.12)'; c.fillRect(Math.random()*w,Math.random()*hh,2,2);}
  });
  bankTex.repeat.set(24,26);
  var bankMat=new THREE.MeshLambertMaterial({map:bankTex});
  [-1,1].forEach(function(sd){
    var g=new THREE.PlaneGeometry(220,WATER_L); g.rotateX(-Math.PI/2);
    var b=new THREE.Mesh(g,bankMat); b.position.set(sd*(10.6+110),0.4,WATER_Z); scene.add(b);
    var mud=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,WATER_L),new THREE.MeshLambertMaterial({color:0x5b4630}));
    mud.position.set(sd*10.8,0.0,WATER_Z); scene.add(mud);
  });

  /* shared prop material */
  var propMat=new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:6,specular:0x111111,side:THREE.DoubleSide});

  /* ----- scenery geometries ----- */
  function palmGeo(){
    var parts=[], lean=rand(-0.14,0.14), H=rand(7,10.5);
    parts.push({g:new THREE.CylinderGeometry(0.15,0.3,H,6),p:[Math.sin(lean)*H/2,H/2,0],r:[0,0,-lean],c:0x7b5a3c});
    var top=new THREE.Vector3(Math.sin(lean)*H,Math.cos(lean)*H,0), up=new THREE.Vector3(0,1,0), n=8;
    for(var k=0;k<n;k++){
      var a=k/n*Math.PI*2+rand(-0.2,0.2), dir=new THREE.Vector3(Math.cos(a),rand(-0.5,0.12),Math.sin(a)).normalize();
      var q=new THREE.Quaternion().setFromUnitVectors(up,dir), len=rand(3.4,4.4);
      var c=top.clone().add(dir.clone().multiplyScalar(len/2));
      parts.push({g:new THREE.ConeGeometry(0.55,len,4),p:[c.x,c.y,c.z],q:q,s:[1,1,0.3],c:k%2?0x2f7d32:0x3f9a3d});
    }
    for(var j=0;j<3;j++){
      var aa=j*2.1;
      parts.push({g:new THREE.SphereGeometry(0.3,6,5),p:[top.x+Math.cos(aa)*0.35,top.y-0.35,top.z+Math.sin(aa)*0.35],c:j===0?0x8a9a2c:0x5a3d22});
    }
    return bake(parts);
  }
  function houseGeo(){
    var wall=pick([0xf0e3c5,0xe9c883,0xd9e6dd,0xf3d7c4,0xc7dcea]), roof=pick([0xa9472c,0xb85a34,0x8f3d27]);
    var rg=new THREE.ConeGeometry(1,1,4,1); rg.rotateY(Math.PI/4);
    return bake([
      {g:new THREE.BoxGeometry(4.4,2.6,5.2),p:[0,1.3,0],c:wall},
      {g:rg,p:[0,2.6+0.95,0],s:[3.7,1.9,4.4],c:roof},
      {g:new THREE.BoxGeometry(0.1,1.6,0.9),p:[2.2,0.8,0],c:0x3b2a1c},
      {g:new THREE.BoxGeometry(0.1,0.7,0.7),p:[2.2,1.6,1.5],c:0x6fa7b8},
      {g:new THREE.BoxGeometry(0.1,0.7,0.7),p:[2.2,1.6,-1.5],c:0x6fa7b8},
      {g:new THREE.BoxGeometry(1.6,0.2,5.6),p:[2.6,0.1,0],c:0xcdbb95}
    ]);
  }
  function hutGeo(){
    var rg=new THREE.ConeGeometry(1,1,4,1); rg.rotateY(Math.PI/4);
    return bake([
      {g:new THREE.BoxGeometry(2.4,1.5,2.4),p:[0,0.75,0],c:0xc9a56a},
      {g:rg,p:[0,1.5+0.8,0],s:[2.5,1.6,2.5],c:0xb89b4e},
      {g:new THREE.BoxGeometry(0.1,1.0,0.6),p:[1.2,0.5,0],c:0x4a3320}
    ]);
  }
  function churchGeo(){
    var sp=new THREE.ConeGeometry(1,1,4,1); sp.rotateY(Math.PI/4);
    var rg=new THREE.ConeGeometry(1,1,4,1); rg.rotateY(Math.PI/4);
    return bake([
      {g:new THREE.BoxGeometry(5,4,8),p:[0,2,0],c:0xf4efe2},
      {g:rg,p:[0,4+0.9,0],s:[3.6,1.8,5.7],c:0xb85a34},
      {g:new THREE.BoxGeometry(2.4,8.5,2.4),p:[2.8,4.25,-4.8],c:0xf4efe2},
      {g:sp,p:[2.8,8.5+1.6,-4.8],s:[1.8,3.2,1.8],c:0x8f3d27},
      {g:new THREE.BoxGeometry(0.15,1.3,0.15),p:[2.8,8.5+3.9,-4.8],c:0xe3ab3c},
      {g:new THREE.BoxGeometry(0.7,0.15,0.15),p:[2.8,8.5+3.9,-4.8],c:0xe3ab3c},
      {g:new THREE.BoxGeometry(0.1,2.2,1.2),p:[2.5,1.1,0],c:0x3b2a1c}
    ]);
  }
  function lightGeo(){
    return bake([
      {g:new THREE.CylinderGeometry(1.5,2.4,14,10),p:[0,7,0],c:0xf3efe6},

    burst(boat.x,0.8,-3,26,1,0.55,0.4);
    if(e){
      if(e.kind==='hyacinth'){e.dead=true;burst(e.x,0.4,e.z,16,0.6,1,0.5);}
      else{
        var sg=(boat.x-e.x)>=0?1:-1; boat.x=clamp(boat.x+sg*Math.min(3,Math.max(0.6,e.hw+0.75-Math.abs(boat.x-e.x)+0.5)),-BOUND,BOUND); latV=sg*11;
      }
      e.hit=true;
    }
    if(lives<=0){lives=0;gameOver();}
  }

  function setView(){
    var w=Math.max(1,container.clientWidth), hh=Math.max(1,container.clientHeight);
    renderer.setSize(w,hh,false); camera.aspect=w/hh;
    camera.userData.baseFov=w/hh<0.8?78:(w/hh<1.2?68:62);
    camera.updateProjectionMatrix();
  }
  var ro=null;
  if(window.ResizeObserver){ro=new ResizeObserver(setView);ro.observe(container);}else{window.addEventListener('resize',setView);}
  setView();

  function applyZone(){
    var zs=zoneState(distance), A=ZONES[zs.i], B=ZONES[zs.j], t=zs.t;
    function mix(key,target){tmpA.setHex(A[key]);tmpB.setHex(B[key]);tmpA.lerp(tmpB,t);target.copy(tmpA);}
    mix('top',skyMat.uniforms.top.value); mix('bot',skyMat.uniforms.bottom.value);
    mix('fog',fog.color); mix('water',waterMat.color); mix('sun',sunMat.color); mix('light',sunLight.color); mix('hemi',hemi.color);
    haloMat.color.copy(sunMat.color);
    sunMesh.position.y=lerp(A.sunY,B.sunY,t);
    if(zs.id!==zoneId){
      var first=zoneId===-1; zoneId=zs.id;
      if(state==='playing'&&!first){cb.onZone(A.name,Math.floor(distance));sfx.zone();}
      if(state==='playing'&&first){cb.onZone(A.name,0);}
    }
  }

  function update(dt){
    time+=dt;
    var playing=state==='playing';
    /* speed */
    if(playing){
      var wantBoost=input.boost&&!locked&&stamina>0;
      if(wantBoost){stamina-=26*dt;if(stamina<=0){stamina=0;locked=true;}}
      else{stamina=Math.min(100,stamina+8*dt);}
      if(locked&&stamina>=25) locked=false;
      boosting=wantBoost&&stamina>0;
      slowMul+=(1-slowMul)*Math.min(1,dt*1.1);
      var target=baseSpeed()*(boosting?1.5:1)*slowMul;
      speed+=(target-speed)*Math.min(1,dt*2.2);
      distance+=speed*dt;
      invul=Math.max(0,invul-dt);
    }else if(state==='over'){
      boosting=false; speed+=(0-speed)*Math.min(1,dt*0.9);
    }else if(state==='ready'){
      boosting=false; speed+=(9-speed)*Math.min(1,dt*2);
    }
    boostAmt+=((boosting?1:0)-boostAmt)*Math.min(1,dt*4);
    scroll+=speed*dt;
    spm=38+speed*1.4;
    var off=speed*dt*0.1;
    waterTex.offset.y=(waterTex.offset.y+off)%1; bankTex.offset.y=(bankTex.offset.y+off)%1;

    /* steering */
    if(playing){
      var steer=(input.right?1:0)-(input.left?1:0), tv;
      if(ptrTarget!==null) tv=clamp((ptrTarget-boat.x)*6,-LAT,LAT); else tv=steer*LAT;
      latV+=clamp(tv-latV,-ACC*dt,ACC*dt);
      boat.x+=latV*dt;
      if(boat.x>BOUND){boat.x=BOUND;latV=Math.min(latV,0);}
      if(boat.x<-BOUND){boat.x=-BOUND;latV=Math.max(latV,0);}
    }else if(state==='ready'){
      boat.x=Math.sin(time*0.45)*1.4; latV=Math.cos(time*0.45)*0.6;
    }else{
      latV*=(1-Math.min(1,dt*3)); boat.x=clamp(boat.x+latV*dt,-BOUND,BOUND);
    }

    /* spawning */
    if(playing){
      lastSpawnZ+=speed*dt;
      if(lastSpawnZ>SPAWN_Z+nextGap){spawnPattern(SPAWN_Z);lastSpawnZ=SPAWN_Z;nextGap=gapNow();}
    }

    /* scenery */
    for(var si=0;si<scenery.length;si++){
      var sc=scenery[si]; sc.m.position.z+=0;
      sc.z+=speed*dt;
      if(sc.z>22){sc.z-=260;placeX(sc);}
      sc.m.position.set(sc.x,0.4,sc.z);
    }

    /* entities */
    var bz=-0.8, hwB=0.72, hlB=3.7;
    for(var ei=ents.length-1;ei>=0;ei--){
      var e=ents[ei];
      e.z+=(speed-e.vr)*dt;
      if(e.vx){e.x+=e.vx*dt;if(Math.abs(e.x)>6.5)e.vx=-e.vx;}
      var m=e.mesh;
      if(e.kind==='coconut'){m.position.set(e.x,0.55+Math.sin(time*2.4+e.phase)*0.12,e.z);e.spin.rotation.y+=dt*2;}
      else if(e.kind==='lotus'){m.position.set(e.x,0.1+Math.sin(time*2+e.phase)*0.05,e.z);e.spin.rotation.y+=dt*0.8;var ps=1+Math.sin(time*4)*0.04;m.scale.set(ps,ps,ps);}
      else if(e.kind==='hyacinth'){m.position.set(e.x,0.1+Math.sin(time*1.6+e.phase)*0.04,e.z);}
      else if(e.kind==='houseboat'){m.position.set(e.x,0.1+Math.sin(time*1.1+e.phase)*0.05,e.z);m.rotation.z=Math.sin(time*0.9+e.phase)*0.02;}
      else if(e.kind==='rival'){
        e.phase+=dt*(5+e.vr*0.16); animBoat(e.boat,e.phase,1);
        m.position.set(e.x,0.1+Math.sin(time*2+e.phase*0.3)*0.04,e.z);
      }
      if(playing&&!e.hit&&!e.dead&&Math.abs(e.x-boat.x)<e.hw+hwB&&Math.abs(e.z-bz)<e.hl+hlB){
        if(e.kind==='coconut'){
          e.dead=true;coconuts++;stamina=Math.min(100,stamina+10);sfx.coco();burst(e.x,0.8,e.z,10,1,0.85,0.35);
        }else if(e.kind==='lotus'){
          e.dead=true;lives=Math.min(MAXL,lives+1);sfx.lotus();burst(e.x,0.8,e.z,16,1,0.6,0.8);
        }else{
          hurt(e);
        }
      }
      if(e.z>18||e.dead){removeEnt(ei);}
    }

    /* player boat */
    var wob=Math.sin(time*2.1)*0.05;
    player.group.position.set(boat.x,0.06+wob+boostAmt*0.04,0);
    player.group.rotation.z=-latV*0.02+Math.sin(time*1.3)*0.015;
    player.group.rotation.x=-boostAmt*0.03+Math.sin(time*1.7)*0.01;
    player.group.rotation.y=-latV*0.012;
    if(state!=='over') strokePhase+=dt*(spm/60)*Math.PI*2; else strokePhase+=dt*(spm/60)*Math.PI*2*0.2;
    animBoat(player,strokePhase,state==='over'?Math.min(1,speed/8):1);
    player.group.visible=!(invul>0&&Math.floor(time*14)%2===0);
    if(playing){
      var beat=Math.floor(strokePhase/(Math.PI*2));
      if(beat!==lastBeat){lastBeat=beat;sfx.beat();}
    }

    /* water surface */
    var arr=wPos.array;
    for(var vi=0;vi<arr.length;vi+=3){
      var bx=wBase[vi], bzz=wBase[vi+2]+WATER_Z-scroll;
      arr[vi+1]=Math.sin(bzz*0.33+time*1.4)*0.09+Math.sin(bx*0.45+bzz*0.18-time*1.1)*0.08;
    }
    wPos.needsUpdate=true;

    /* particles */
    if(state!=='over'&&speed>2){
      var rate=boosting?3:1;
      for(var wk=0;wk<rate;wk++){
        var sd=Math.random()<0.5?-1:1;
        emit(boat.x+sd*0.7,0.12,5.4,sd*rand(0.6,2.2),rand(0.2,0.9),rand(1,3),rand(0.6,1.0),0.75,0.9,0.95,0);
      }
      if(Math.random()<(boosting?0.9:0.35)) emit(boat.x+rand(-0.4,0.4),0.3,-5.8,rand(-1.4,1.4),rand(0.8,2.2),rand(-1,1),0.5,0.85,0.95,1,4);
    }
    for(var pk=0;pk<NP;pk++){
      if(pLife[pk]<=0) continue;
      pLife[pk]-=dt;
      if(pLife[pk]<=0){pPos[pk*3+1]=-100;pCol[pk*3]=pCol[pk*3+1]=pCol[pk*3+2]=0;continue;}
      pVel[pk*3+1]-=pGrav[pk]*dt;
      pPos[pk*3]+=pVel[pk*3]*dt; pPos[pk*3+1]+=pVel[pk*3+1]*dt; pPos[pk*3+2]+=(pVel[pk*3+2]+speed)*dt;
      if(pPos[pk*3+1]<0.05&&pGrav[pk]>0){pPos[pk*3+1]=0.05;pVel[pk*3+1]=0;}
      var f=pLife[pk]/pMax[pk];
      pCol[pk*3]=pBase[pk*3]*f;pCol[pk*3+1]=pBase[pk*3+1]*f;pCol[pk*3+2]=pBase[pk*3+2]*f;
    }
    pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;

    /* zone / sky */
    applyZone();

    /* camera */
    shake=Math.max(0,shake-dt*1.6);
    var base=camera.userData.baseFov||62, portrait=camera.aspect<0.8;
    camera.fov=base+boostAmt*9;
    camera.updateProjectionMatrix();
    camera.position.set(boat.x*0.55+(Math.random()-0.5)*shake*0.7+(Math.random()-0.5)*boostAmt*0.06,
      (portrait?6.8:5.3)+Math.sin(time*1.9)*0.05+(Math.random()-0.5)*shake*0.5,(portrait?15:12.8));
    camera.lookAt(boat.x*0.75,1.3,-14);
    camera.rotation.z+=-latV*0.0035;
    sky.position.copy(camera.position);

    /* HUD throttle */
    hudT-=dt; if(hudT<=0){hudT=0.1;emitHud();}
  }

  var raf=0, last=performance.now(), destroyed=false;
  function frame(now){
    if(destroyed) return;
    raf=requestAnimationFrame(frame);
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!(dt>0)) dt=0.016;
    if(state!=='paused') update(dt);
    renderer.render(scene,camera);
  }
  applyZone(); prefill(); emitHud();
  raf=requestAnimationFrame(frame);

  return {
    start:function(){ensureAudio();reset();state='playing';lastBeat=Math.floor(strokePhase/(Math.PI*2));applyZone();cb.onZone(ZONES[0].name,0);emitHud();},
    pause:function(){if(state==='playing'){state='paused';emitHud();}},
    resume:function(){if(state==='paused'){state='playing';last=performance.now();ensureAudio();}},
    setInput:function(k,v){input[k]=v;},
    setPointerTarget:function(x){ptrTarget=x;},
    setMuted:function(v){muted=v;},
    getState:function(){return state;},
    destroy:function(){
      destroyed=true;cancelAnimationFrame(raf);
      if(ro)ro.disconnect();else window.removeEventListener('resize',setView);
      try{renderer.dispose();}catch(e){}
      if(renderer.domElement.parentNode)renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
}

/* ---------- React interface ---------- */
function readBest(){try{return parseInt(localStorage.getItem('alappuzha-best'),10)||0;}catch(e){return 0;}}
function writeBest(v){try{localStorage.setItem('alappuzha-best',String(v));}catch(e){}}
function fmt(n){return Number(n).toLocaleString('en-IN');}

function Heart(p){
  return h('svg',{viewBox:'0 0 24 24',width:22,height:22,'aria-hidden':'true'},
    h('path',{d:'M12 21C12 21 3 14.5 3 8.5A4.5 4.5 0 0 1 12 6.5A4.5 4.5 0 0 1 21 8.5C21 14.5 12 21 12 21Z',
      fill:p.on?'#e0482f':'none',stroke:p.on?'#e0482f':'rgba(244,233,203,.5)',strokeWidth:1.6,strokeLinejoin:'round'}));
}
function PauseIcon(){return h('svg',{viewBox:'0 0 24 24',width:20,height:20,'aria-hidden':'true',fill:'#f4e9cb'},h('rect',{x:6,y:5,width:4,height:14,rx:1}),h('rect',{x:14,y:5,width:4,height:14,rx:1}));}
function SoundIcon(p){
  return h('svg',{viewBox:'0 0 24 24',width:20,height:20,'aria-hidden':'true',fill:'none',stroke:'#f4e9cb',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
    h('path',{d:'M4 9v6h4l5 4V5L8 9H4z',fill:'#f4e9cb'}),
    p.muted?h('path',{d:'M17 9l5 6M22 9l-5 6'}):h('path',{d:'M16.5 8.5a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12'}));
}

function App(){
  var stage=useRef(null), game=useRef(null), phaseRef=useRef('ready');
  var _p=useState('ready'), phase=_p[0], setPhaseS=_p[1];
  var _h=useState({score:0,distance:0,coconuts:0,lives:3,stamina:100,locked:false,boosting:false,spm:50,zone:'Punnamada Lake'}), hud=_h[0], setHud=_h[1];
  var _z=useState(null), zone=_z[0], setZone=_z[1];
  var _b=useState(readBest), best=_b[0], setBest=_b[1];
  var _r=useState(null), result=_r[0], setResult=_r[1];
  var _m=useState(false), muted=_m[0], setMuted=_m[1];
  var _e=useState(null), err=_e[0], setErr=_e[1];
  var _f=useState(0), flash=_f[0], setFlash=_f[1];
  var _bo=useState(false), boostOn=_bo[0], setBoostOn=_bo[1];
  var bestRef=useRef(best); bestRef.current=best;

  function setPhase(p){phaseRef.current=p;setPhaseS(p);}

  useEffect(function(){
    var g=createGame(stage.current,{
      onHud:setHud,
      onZone:function(n,d){setZone({n:n,d:d,k:Math.random()});},
      onHit:function(){setFlash(function(f){return f+1;});},
      onOver:function(r){
        var isBest=r.score>bestRef.current;
        if(isBest){writeBest(r.score);setBest(r.score);}
        setResult({score:r.score,distance:r.distance,coconuts:r.coconuts,isBest:isBest});
        setPhase('over');
      },
      onError:setErr
    });
    game.current=g;
    return function(){if(g)g.destroy();};
  },[]);

  useEffect(function(){
    if(!zone) return;
    var t=setTimeout(function(){setZone(null);},3300);
    return function(){clearTimeout(t);};
  },[zone]);

  function start(){
    if(!game.current) return;
    setResult(null);setZone(null);game.current.start();setPhase('playing');
  }
  function togglePause(){
    var g=game.current; if(!g) return;
    if(phaseRef.current==='playing'){g.pause();setPhase('paused');}
    else if(phaseRef.current==='paused'){g.resume();setPhase('playing');}
  }
  function setBoost(v){setBoostOn(v);if(game.current)game.current.setInput('boost',v);}

  useEffect(function(){
    function map(e){
      var k=e.key;
      if(k==='ArrowLeft'||k==='a'||k==='A') return 'left';
      if(k==='ArrowRight'||k==='d'||k==='D') return 'right';
      if(k===' '||k==='Shift'||k==='ArrowUp'||k==='w'||k==='W') return 'boost';
      return null;
    }
    function down(e){
      var ph=phaseRef.current, g=game.current; if(!g) return;
      if(ph==='ready'||ph==='over'){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}
        return;
      }
      if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();togglePause();return;}
      var m=map(e); if(!m) return;
      e.preventDefault();
      if(ph==='playing'){g.setInput(m,true);if(m==='boost')setBoostOn(true);}
    }
    function up(e){
      var g=game.current; if(!g) return;
      var m=map(e); if(!m) return;
      g.setInput(m,false);if(m==='boost')setBoostOn(false);
    }
    function vis(){if(document.hidden&&phaseRef.current==='playing')togglePause();}
    window.addEventListener('keydown',down);window.addEventListener('keyup',up);document.addEventListener('visibilitychange',vis);
    return function(){window.removeEventListener('keydown',down);window.removeEventListener('keyup',up);document.removeEventListener('visibilitychange',vis);};
  },[]);

  var steerId=useRef(null);
  function toWorld(e){
    var r=stage.current.getBoundingClientRect();
    return clamp(((e.clientX-r.left)/r.width*2-1)*9,-8,8);
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function pDown(e){
    if(phaseRef.current!=='playing'||!game.current) return;
    steerId.current=e.pointerId;
    try{stage.current.setPointerCapture(e.pointerId);}catch(x){}
    game.current.setPointerTarget(toWorld(e));
  }
  function pMove(e){
    if(steerId.current!==e.pointerId||phaseRef.current!=='playing') return;
    game.current.setPointerTarget(toWorld(e));
  }
  function pUp(e){
    if(steerId.current!==e.pointerId) return;
    steerId.current=null; if(game.current) game.current.setPointerTarget(null);
  }

  function toggleMute(){var v=!muted;setMuted(v);if(game.current)game.current.setMuted(v);}

  var playing=phase==='playing'||phase==='paused';
  var hearts=[]; var maxShow=Math.max(3,hud.lives);
  for(var i=0;i<maxShow;i++) hearts.push(h(Heart,{key:i,on:i<hud.lives}));

  return h('div',{className:'stage',ref:stage,onPointerDown:pDown,onPointerMove:pMove,onPointerUp:pUp,onPointerCancel:pUp},
    err?h('div',{className:'err'},err):null,

    playing?h('div',{className:'hud'},
      h('div',{className:'hud-row'},
        h('div',null,
          h('div',{className:'score-label'},'Score'),
          h('div',{className:'score-num'},fmt(hud.score)),
          h('div',{className:'stats'},
            h('span',null,h('b',null,fmt(hud.distance)),' m'),
            h('span',null,h('b',null,hud.coconuts),' coconuts')),
          h('div',{className:'zone-tag'},hud.zone)),
        h('div',{className:'hud-right'},
          h('div',{className:'hearts','aria-label':hud.lives+' lives'},hearts),
          h('button',{className:'icon-btn',onClick:toggleMute,'aria-label':muted?'Unmute':'Mute',onPointerDown:function(e){e.stopPropagation();}},h(SoundIcon,{muted:muted})),
          h('button',{className:'icon-btn',onClick:togglePause,'aria-label':'Pause',onPointerDown:function(e){e.stopPropagation();}},h(PauseIcon)))),
      h('div',{className:'hud-row bottom'},
        h('div',{className:'power'},
          h('div',{className:'mini-label'},hud.locked?'Catching breath':'Stroke power'),
          h('div',{className:'power-bar'},h('div',{className:'power-fill'+(hud.locked?' locked':hud.boosting?' boosting':''),style:{width:hud.stamina+'%'}})),
          h('div',{className:'spm'},hud.spm+' strokes/min')),
        h('button',{className:'boost-btn'+(boostOn?' on':''),'aria-label':'Boost',
          onPointerDown:function(e){e.stopPropagation();e.preventDefault();try{e.currentTarget.setPointerCapture(e.pointerId);}catch(x){}setBoost(true);},
          onPointerUp:function(e){e.stopPropagation();setBoost(false);},
          onPointerCancel:function(){setBoost(false);},
          onContextMenu:function(e){e.preventDefault();}},
          h('span',null,'BOOST',h('small',null,'hold')))) ):null,

    phase==='playing'&&zone?h('div',{className:'toast',key:zone.k},h('b',null,zone.n),zone.d>0?' · '+fmt(zone.d)+' m':''):null,
    flash>0?h('div',{className:'flash',key:flash}):null,

    phase==='ready'?h('div',{className:'overlay'},
      h('div',{className:'panel'},
        h('p',{className:'eyebrow'},'Venice of the East · Kerala'),
        h('h1',{className:'title'},'Alappuzha'),
        h('p',{className:'mal',lang:'ml'},'ആലപ്പുഴ'),
        h('p',{className:'lede'},'Row a snake boat down the backwaters at Punnamada. Grab tender coconuts, slip past water hyacinth and houseboats, and overtake the rival crews.'),
        h('ul',{className:'legend'},
          h('li',null,h('span',{className:'sw',style:{background:'#b9c94a'}}),'Tender coconut: +25 points and a little stamina'),
          h('li',null,h('span',{className:'sw',style:{background:'#f27aa6'}}),'Lotus: one extra life'),
          h('li',null,h('span',{className:'sw',style:{background:'#4e9a38'}}),'Hyacinth, houseboat, rival boat: lose a life')),
        h('div',{className:'keys'},
          h('span',{className:'kb-hint'},h('span',{className:'key'},'A'),h('span',{className:'key'},'D'),'or arrows to steer'),
          h('span',{className:'kb-hint'},h('span',{className:'key'},'Space'),'hold to boost'),
          h('span',{className:'touch-hint'},'Drag to steer, hold BOOST to sprint')),
        h('div',{className:'btn-row'},
          h('button',{className:'btn',onClick:start,autoFocus:true},'Start the race'),
          best>0?h('p',{className:'best'},'Best ',h('b',null,fmt(best))):null))):null,

    phase==='paused'?h('div',{className:'overlay mid'},
      h('div',{className:'panel'},
        h('p',{className:'eyebrow'},'Paused'),
        h('h2',{className:'title small'},'Catch your breath'),
        h('div',{className:'btn-row'},
          h('button',{className:'btn',onClick:togglePause},'Resume'),
          h('button',{className:'btn ghost',onClick:start},'Restart')))):null,

    phase==='over'&&result?h('div',{className:'overlay mid'},
      h('div',{className:'panel'},
        result.isBest?h('span',{className:'badge'},'New best'):h('p',{className:'eyebrow'},'Race over'),
        h('h2',{className:'title small'},result.isBest?'Fastest crew yet':'Out of lives'),
        h('dl',{className:'result'},
          h('div',null,h('dt',null,'Score'),h('dd',null,fmt(result.score))),
          h('div',null,h('dt',null,'Best'),h('dd',null,fmt(Math.max(best,result.score)))),
          h('div',null,h('dt',null,'Distance'),h('dd',null,fmt(result.distance)+' m')),
          h('div',null,h('dt',null,'Coconuts'),h('dd',null,result.coconuts))),
        h('div',{className:'btn-row'},
          h('button',{className:'btn',onClick:start,autoFocus:true},'Row again')))):null
  );
}

RD.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
